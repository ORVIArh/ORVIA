[package]
name = "orvia-quad-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[features]
contract-client-gen = []
export-abi = []

[dependencies]
rustc_apfloat = "=0.2.3"
ruint = { version = "=1.17.2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
stylus-sdk = "=0.10.10"

[dev-dependencies]
serde_json = "=1.0.149"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
