name: Hybrid 256 contract checks

on:
  push:
    branches: [main, research/mainnet-readiness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  local-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify contracts, report admission and deployment recovery locally
        run: npm run test:hybrid
